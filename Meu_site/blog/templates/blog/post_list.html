<!DOCTYPE html>
<html>
<head>
    <title>Posts</title>
</head>
<body>
<h1>Lista de Posts</h1>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'post_detail' post.pk %}">
                    {{ post.titulo }}
                </a>
            </li>
        {% empty %}
            <li>Nenhum post encontrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
